<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Year Countdown</title>
<style>
  :root {
    --bg: #ffffff;
    --surface: #f6f6f6;
    --border: #e8e8e8;
    --text: #1f1f1f;
    --muted: #8a8a8a;
    --accent: #1f1f1f;
    --track: #ececec;
    --tip-bg: #1f1f1f;
    --tip-text: #ffffff;
    --shadow: 0 1px 2px rgba(0,0,0,.05);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  :root[data-theme="dark"] {
    --bg: #2b2b2d;
    --surface: #343437;
    --border: #404044;
    --text: #ececec;
    --muted: #9a9a9f;
    --accent: #ececec;
    --track: #3d3d41;
    --tip-bg: #ececec;
    --tip-text: #1f1f1f;
    --shadow: 0 1px 2px rgba(0,0,0,.25);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); font-family: var(--font); transition: background .25s, color .25s; }
  body { padding: 20px; min-height: 100vh; }
  .wrap { max-width: 880px; margin: 0 auto; }

  .topbar { display: flex; justify-content: flex-end; }
  button { font-family: inherit; cursor: pointer; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; font-size: 15px; box-shadow: var(--shadow); width: 34px; height: 32px; display: grid; place-items: center; transition: border-color .15s; }
  button:hover { border-color: var(--muted); }

  .hero { text-align: center; padding: 20px 0 8px; }
  .big { font-size: clamp(110px, 30vw, 280px); line-height: .95; font-weight: 800; letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
  .label { margin-top: 6px; font-size: clamp(15px, 2.6vw, 22px); color: var(--muted); font-weight: 500; }
  .hms { margin-top: 14px; font-size: clamp(14px, 2.4vw, 20px); color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .hms b { color: var(--text); font-weight: 600; }

  /* quarter bar */
  .quarters { margin: 56px auto 0; max-width: 640px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .q { position: relative; outline: none; cursor: default; }
  .q .bar { height: 10px; border-radius: 99px; background: var(--track); overflow: hidden; }
  .q .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .6s ease; }
  .q.passed .bar i { opacity: .35; }
  .q .name { margin-top: 8px; font-size: 12px; font-weight: 600; text-align: center; }
  .q .range { font-size: 11px; color: var(--muted); text-align: center; margin-top: 1px; }
  .q.current .name { color: var(--text); }
  .q:not(.current) .name { color: var(--muted); }

  .tip { position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%) translateY(4px); background: var(--tip-bg); color: var(--tip-text); font-size: 12px; font-weight: 500; line-height: 1.35; padding: 7px 10px; border-radius: 7px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; z-index: 5; text-align: center; }
  .tip::after { content: ""; position: absolute; top: 100%; left: 50%; margin-left: -5px; border: 5px solid transparent; border-top-color: var(--tip-bg); }
  .q:first-child .tip { left: 0; transform: translateY(4px); }
  .q:first-child .tip::after { left: 24px; margin-left: 0; }
  .q:last-child .tip { left: auto; right: 0; transform: translateY(4px); }
  .q:last-child .tip::after { left: auto; right: 24px; margin-left: 0; }
  .q:hover .tip, .q:focus .tip { opacity: 1; transform: translateX(-50%) translateY(0); }
  .q:first-child:hover .tip, .q:first-child:focus .tip,
  .q:last-child:hover .tip, .q:last-child:focus .tip { transform: translateY(0); }

  .pct { margin-top: 18px; font-size: 12px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <button id="themeBtn" type="button" aria-label="Toggle light and dark mode">☾</button>
  </div>

  <div class="hero">
    <div class="big" id="days">0</div>
    <div class="label" id="label">days left</div>
    <div class="hms" id="hms"></div>
  </div>

  <div class="quarters" id="quarters"></div>
  <div class="pct" id="pct"></div>
</div>

<script>
(function () {
  var root = document.documentElement;
  var THEME_KEY = "yc-theme";

  function load(key, fallback) {
    try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
  }
  function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }

  // ---------- theme ----------
  var params = new URLSearchParams(location.search);
  var theme = params.get("theme") || load(THEME_KEY, null) ||
    (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  var themeBtn = document.getElementById("themeBtn");
  function applyTheme(t) {
    theme = t;
    root.setAttribute("data-theme", t);
    themeBtn.textContent = t === "dark" ? "☀" : "☾";
  }
  applyTheme(theme);
  themeBtn.addEventListener("click", function () {
    applyTheme(theme === "dark" ? "light" : "dark");
    save(THEME_KEY, theme);
  });

  function pad(n) { return String(n).padStart(2, "0"); }
  function plural(n, w) { return n + " " + w + (n === 1 ? "" : "s"); }

  var elDays = document.getElementById("days"),
      elLabel = document.getElementById("label"),
      elHms = document.getElementById("hms"),
      elPct = document.getElementById("pct"),
      elQ = document.getElementById("quarters");

  var QNAMES = ["Q1", "Q2", "Q3", "Q4"];
  var QRANGES = ["Jan – Mar", "Apr – Jun", "Jul – Sep", "Oct – Dec"];
  var builtYear = null, qEls = [];

  function buildQuarters() {
    elQ.innerHTML = "";
    qEls = [];
    for (var i = 0; i < 4; i++) {
      var q = document.createElement("div");
      q.className = "q";
      q.tabIndex = 0; // allows tap / keyboard focus to show the tooltip
      q.innerHTML =
        '<div class="tip"></div>' +
        '<div class="bar"><i></i></div>' +
        '<div class="name">' + QNAMES[i] + '</div>' +
        '<div class="range">' + QRANGES[i] + '</div>';
      elQ.appendChild(q);
      qEls.push(q);
    }
  }

  function tick() {
    var now = new Date();
    var y = now.getFullYear();
    if (builtYear !== y) { buildQuarters(); builtYear = y; }

    // year countdown
    var yStart = new Date(y, 0, 1), yEnd = new Date(y + 1, 0, 1);
    var left = yEnd - now;
    var d = Math.floor(left / 86400000);
    var h = Math.floor(left / 3600000) % 24;
    var m = Math.floor(left / 60000) % 60;
    var s = Math.floor(left / 1000) % 60;
    elDays.textContent = d;
    elLabel.textContent = (d === 1 ? "day" : "days") + " left in " + y;
    elHms.innerHTML = "<b>" + pad(h) + "</b>h &nbsp;<b>" + pad(m) + "</b>m &nbsp;<b>" + pad(s) + "</b>s";
    elPct.textContent = (((now - yStart) / (yEnd - yStart)) * 100).toFixed(1) + "% of " + y + " complete";

    // quarters
    for (var i = 0; i < 4; i++) {
      var qs = new Date(y, i * 3, 1), qe = new Date(y, i * 3 + 3, 1);
      var el = qEls[i], fill = el.querySelector(".bar i"), tip = el.querySelector(".tip");
      var total = Math.round((qe - qs) / 86400000);
      var text, pct, state;

      if (now >= qe) {
        state = "passed"; pct = 100;
        text = QNAMES[i] + " passed";
      } else if (now >= qs) {
        state = "current"; pct = ((now - qs) / (qe - qs)) * 100;
        var dl = Math.floor((qe - now) / 86400000);
        text = QNAMES[i] + ": " + (dl < 1 ? "less than 1 day left" : plural(dl, "day") + " left");
      } else {
        state = "upcoming"; pct = 0;
        var until = Math.ceil((qs - now) / 86400000);
        text = QNAMES[i] + ": " + plural(total, "day") + " left<br>starts in " + plural(until, "day");
      }
      el.className = "q " + state;
      fill.style.width = pct.toFixed(2) + "%";
      tip.innerHTML = text;
    }
  }

  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
